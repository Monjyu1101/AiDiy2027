[package]
edition.workspace = true
license.workspace = true
name = "codex-model-provider-info"
version.workspace = true

[lib]
doctest = false
name = "codex_model_provider_info"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-client = { workspace = true }
codex-http-client = { workspace = true }
